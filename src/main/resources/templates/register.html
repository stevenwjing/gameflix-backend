<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Register - GameFlix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
</head>
<body>
<div class="container my-4" style="max-width: 480px;">
  <h1>Create a GameFlix Account</h1>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <form th:action="@{/register}" th:object="${registration}" method="post">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" th:field="*{username}" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" th:field="*{password}" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Display Name</label>
      <input type="text" th:field="*{memberName}" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" th:field="*{memberEmail}" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
    <a th:href="@{/login}" class="btn btn-secondary">Back to Login</a>
  </form>
</div>
</body>
</html>
