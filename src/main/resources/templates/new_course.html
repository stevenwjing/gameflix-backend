<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add Course</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
</head>
<body>
<div class="container my-4">
  <h1>Add New Course</h1>
  <form action="#" th:action="@{/saveCourse}" th:object="${course}" method="post">
    <div class="mb-3">
      <label class="form-label">Course Department</label>
      <input type="text" th:field="*{courseDept}" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Course Number</label>
      <input type="text" th:field="*{courseNum}" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Course Name</label>
      <input type="text" th:field="*{courseName}" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Number of Students</label>
      <input type="text" th:field="*{courseStuds}" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Save Course</button>
    <a th:href="@{/}" class="btn btn-secondary">Back</a>
  </form>
</div>
</body>
</html>
