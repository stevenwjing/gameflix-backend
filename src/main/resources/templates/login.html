<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - GameFlix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
</head>
<body>
<div class="container my-4" style="max-width: 420px;">
  <h1>GameFlix Login</h1>
  <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
  <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
  <div th:if="${param.registered}" class="alert alert-success">Account created — log in below.</div>
  <form th:action="@{/login}" method="post">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Log In</button>
    <a th:href="@{/}" class="btn btn-secondary">Back</a>
  </form>
  <p class="mt-3">No account? <a th:href="@{/register}">Register here</a></p>
</div>
</body>
</html>
