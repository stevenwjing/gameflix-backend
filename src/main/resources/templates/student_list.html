<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Students</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
</head>
<body>
<div class="container my-4">
  <a th:href="@{/showNewStudentForm}" class="btn btn-primary mb-3">Add Student</a>
  <a th:href="@{/}" class="btn btn-secondary mb-3">Back to Courses</a>

  <h1>Students List</h1>
  <table class="table table-striped table-bordered">
    <thead>
    <tr>
      <th>Student Name</th>
      <th>Student Email</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="student : ${listStudents}">
      <td th:text="${student.studName}"></td>
      <td th:text="${student.studEmail}"></td>
      <td>
        <a th:href="@{'/showStudFormForUpdate/' + ${student.sid}}" class="btn btn-primary">Update</a>
        <a th:href="@{'/deleteStudent/' + ${student.sid}}" class="btn btn-danger">Delete</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
