<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Member</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
</head>
<body>
<div class="container my-4">
    <h1>Add New Member</h1>
    <form action="#" th:action="@{/saveMember}" th:object="${member}" method="post">
        <div class="mb-3">
            <label class="form-label">Member Name</label>
            <input type="text" th:field="*{memberName}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Member Email</label>
            <input type="text" th:field="*{memberEmail}" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Save Member</button>
        <a th:href="@{/memberList}" class="btn btn-secondary">Back</a>
    </form>
</div>
</body>
</html>
