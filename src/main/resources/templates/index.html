<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0"
          crossorigin="anonymous">
</head>
<body>
<div class="container my-4">

    <hr/>

    <a th:href="@{/showNewCourseForm}" class="btn btn-primary mb-3">Add Course</a>

    <h1>Courses List</h1>

    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>
                <a th:href="@{'/page/' + ${currentPage} + '?sortField=courseDept&sortDir=' + ${sortField == 'courseDept' ? reverseSortDir : 'asc'}}">
                    Course Department</a>
            </th>
            <th>
                <a th:href="@{'/page/' + ${currentPage} + '?sortField=courseNum&sortDir=' + ${sortField == 'courseNum' ? reverseSortDir : 'asc'}}">
                    Course Number</a>
            </th>
            <th>
                <a th:href="@{'/page/' + ${currentPage} + '?sortField=courseName&sortDir=' + ${sortField == 'courseName' ? reverseSortDir : 'asc'}}">
                    Course Name</a>
            </th>
            <th>
                <a th:href="@{'/page/' + ${currentPage} + '?sortField=courseStuds&sortDir=' + ${sortField == 'courseStuds' ? reverseSortDir : 'asc'}}">
                    Number of Students</a>
            </th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${listCourses}">
            <td th:text="${course.courseDept}"></td>
            <td th:text="${course.courseNum}"></td>
            <td th:text="${course.courseName}"></td>
            <td th:text="${course.courseStuds}"></td>
            <td>
                <a th:href="@{'/showFormForUpdate/' + ${course.id}}" class="btn btn-primary">Update</a>
                <a th:href="@{'/deleteCourse/' + ${course.id}}" class="btn btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${totalPages > 1}">
        <div class="row">
            <div class="col-sm-2">
                Total Rows: [[${totalItems}]]
            </div>
            <div class="col-sm-1" th:each="i : ${#numbers.sequence(1, totalPages)}">
                <a th:if="${currentPage != i}" th:href="@{'/page/' + ${i} + '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}">[[${i}]]</a>
                <span th:unless="${currentPage != i}">[[${i}]]</span>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/showNewStudentForm}" class="btn btn-primary">Add Student</a>
        <a th:href="@{/studentList}" class="btn btn-primary">Update A Student</a>
    </div>

</div>
</body>
</html>
