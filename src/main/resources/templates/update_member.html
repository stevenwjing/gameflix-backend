<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Update Member</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
</head>
<body>
<div class="container my-4">
  <h1>Update Member</h1>
  <form action="#" th:action="@{/saveMember}" th:object="${member}" method="post">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
      <label class="form-label">Member Name</label>
      <input type="text" th:field="*{memberName}" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Member Email</label>
      <input type="text" th:field="*{memberEmail}" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Subscribed Games</label>
      <table class="table table-sm table-bordered align-middle">
        <thead>
        <tr>
          <th style="width: 2.5rem;"></th>
          <th>Title</th>
          <th>Genre</th>
          <th>Platform</th>
          <th>Price</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="game : ${allGames}">
          <td>
            <input class="form-check-input" type="checkbox" th:field="*{games}" th:value="${game.id}">
          </td>
          <td th:text="${game.title}"></td>
          <td th:text="${game.genre}"></td>
          <td th:text="${game.platform}"></td>
          <td th:text="${game.price}"></td>
        </tr>
        </tbody>
      </table>
      <small class="text-muted">Check the games this member should be subscribed to.</small>
    </div>

    <button type="submit" class="btn btn-primary">Update Member</button>
    <a th:href="@{/memberList}" class="btn btn-secondary">Back</a>
  </form>
</div>
</body>
</html>
