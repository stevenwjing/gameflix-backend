spring.application.name=gameflix
# DATASOURCE CONFIGURATION
spring.datasource.url=jdbc:mysql://localhost:3307/gameflix?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpass}

# JPA / HIBERNATE PROPERTIES
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# SEED DATA (runs src/main/resources/data.sql after Hibernate creates the schema)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# LOGGING
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.results=TRACE